name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Spec 0007: a newer push cancels an older run of the same pull request, while
# runs on main queue, so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      # Needs no Cloudflare values, so pull requests from forks run it too.
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # Its web server runs astro build again, so dist/ now holds the build the
      # page tests saw, and that is the one deploy ships.
      - run: pnpm exec playwright test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # Spec 0007: ships the dist/ that check tested, proves the live site serves
  # it, and rolls back on its own when it does not.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The two smoke steps take 28 minutes at worst (every request timing out on
    # every attempt), so only a hung step reaches this, and the production
    # queue moves on.
    timeout-minutes: 40
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: deploy
        run: pnpm exec wrangler deploy --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - id: pages
        run: bash .github/scripts/smoke.sh pages
      - id: rollback
        if: failure() && steps.pages.outcome == 'failure'
        run: pnpm exec wrangler rollback --yes --message "smoke check failed for $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Zone rules make these, so a failure here is red with no rollback.
      - id: redirects
        run: bash .github/scripts/smoke.sh redirects
